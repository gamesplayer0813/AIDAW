[package]
name = "aidaw-gui"
description = "AIDAW desktop editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aidaw"
path = "src/main.rs"

[features]
# ASIO drivers on Windows (`cargo build --release -p aidaw-gui --features asio`).
# Needs LLVM and the Steinberg ASIO SDK, whose licence then covers the exe:
# read the README's ASIO section first.
asio = ["aidaw-engine/asio"]

[dependencies]
aidaw-core.workspace = true
aidaw-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = "0.31"
rfd = "0.15"
egui_extras = { version = "0.31", features = ["svg"] }

[build-dependencies]
winresource = "0.1"
